services:
  - type: web
    name: office-agent-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./office_agent.db
      - key: USE_FAKE_MODEL
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MODEL_NAME
        value: deepseek-chat
      - key: BASE_URL
        value: https://api.deepseek.com
      - key: MODEL_TIMEOUT_SECONDS
        value: "45"
      - key: USE_FAKE_TRANSCRIPTION
        value: "true"
      - key: STT_API_KEY
        sync: false
      - key: STT_BASE_URL
        sync: false
      - key: STT_MODEL
        sync: false
      - key: STT_TIMEOUT_SECONDS
        value: "60"
      - key: MAX_AUDIO_BYTES
        value: "26214400"
      - key: RAG_ENABLED
        value: "true"
      - key: RAG_TOP_K
        value: "5"
      - key: RRF_K
        value: "60"
      - key: OLLAMA_ENABLED
        value: "false"
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: OLLAMA_EMBED_MODEL
        sync: false
      - key: SUPABASE_ENABLED
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "86400"
      - key: CORS_ORIGINS
        value: https://office-agent-web.onrender.com

  - type: web
    name: office-agent-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://office-agent-api.onrender.com/api
