services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/office_agent.db
      USE_FAKE_MODEL: ${USE_FAKE_MODEL:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
      BASE_URL: ${BASE_URL:-https://api.deepseek.com}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-45}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      USE_FAKE_TRANSCRIPTION: ${USE_FAKE_TRANSCRIPTION:-true}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-60}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RRF_K: ${RRF_K:-60}
      SUPABASE_ENABLED: ${SUPABASE_ENABLED:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
    volumes:
      - office-agent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  office-agent-data:
